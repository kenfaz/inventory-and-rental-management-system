<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360" role="img" aria-labelledby="title desc">
  <title id="title">Body measurement reference</title>
  <desc id="desc">Front-view figure with numbered markers at the shoulder, bust, waist, hips, garment length, and sleeve.</desc>
  <defs>
    <style>
      .body { fill: #737373; }
      .measure { fill: none; stroke: #ffe100; stroke-width: 3; stroke-linecap: round; }
      .guide { fill: none; stroke: #ffe100; stroke-width: 2; stroke-dasharray: 5 4; }
      .marker { fill: #ffe100; stroke: #171717; stroke-width: 1.5; }
      .number { fill: #171717; font: 700 11px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
